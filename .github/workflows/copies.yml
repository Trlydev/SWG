name: copies

# Once a day, note which True Workshop and GameBanana uploads are copies of
# which Steam Workshop item (the CreatorUGCIdentity in their mod.json) and
# publish copies.json on the copies-data branch, read by ppgmods so a mod
# shows as one card with all its copies. Only a few KB of each new or
# changed upload is read (cmd/copyindex). No secrets: the data is public.
on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: copies
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: Fetch the previous index
        run: |
          if git ls-remote --exit-code --heads "https://github.com/${{ github.repository }}.git" copies-data >/dev/null; then
            git fetch --depth 1 "https://github.com/${{ github.repository }}.git" copies-data
            git worktree add data FETCH_HEAD
          else
            mkdir data
          fi
      - name: Read new and changed uploads
        run: go run ./cmd/copyindex -dir data
      - name: Publish
        run: |
          out=$(mktemp -d)
          cp data/copies.json "$out"/
          cd "$out"
          git init -q -b copies-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Copies index $(date -u +%F)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" copies-data:copies-data
